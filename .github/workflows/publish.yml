name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ensure npm supports Trusted Publishing (>= 11.5.1)
        run: |
          node -e '
            const v = require("node:child_process").execSync("npm --version", { encoding: "utf8" }).trim().split(".").map(Number);
            if (v[0] < 11 || (v[0] === 11 && (v[1] < 5 || (v[1] === 5 && v[2] < 1)))) process.exit(1);
          ' || npm install -g npm@latest
          npm --version

      - name: Validate manifests, scripts, and tests
        run: |
          node --check lib/index.js
          node --check lib/matcher.js
          node --check client.js
          node -e 'for (const f of ["package.json", "defaults/personas.json", "locale/zh.json", "locale/en.json"]) JSON.parse(require("node:fs").readFileSync(f, "utf8"));'
          node --test

      - name: Attach tarball to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          npm pack
          gh release upload "$TAG_NAME" *.tgz --clobber
          rm -f *.tgz

      - name: Publish to npm via Trusted Publishing (OIDC)
        run: npm publish --registry=https://registry.npmjs.org --access public
