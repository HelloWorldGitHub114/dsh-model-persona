<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="55%" stop-color="#17171a"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 150) rotate(140) scale(460 280)">
      <stop offset="0%" stop-color="#4f7cff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="650" y1="44" x2="1152" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1e21"/>
      <stop offset="100%" stop-color="#17171a"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer Frame -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="url(#bg)" stroke="#2b2b30"/>
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="url(#glow)"/>

  <!-- Left Column: Brand & Headline -->
  <g transform="translate(56, 54)">
    <!-- Plugin Pill -->
    <rect x="0" y="0" width="194" height="30" rx="15" fill="#1f1f23" stroke="#323238"/>
    <circle cx="16" cy="15" r="4" fill="#34d399"/>
    <text x="30" y="19.5" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="500" letter-spacing="0.2">DeepSeek Harness Plugin</text>

    <!-- Icon + Title -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="54" height="54" rx="14" fill="#222226" stroke="#383840"/>
      <g transform="translate(11, 11)" stroke="#f4f4f5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="3" y="4" width="26" height="24" rx="5"/>
        <circle cx="12" cy="13" r="3"/>
        <path d="M7.5 22c0-2.6 2-4.2 4.5-4.2s4.5 1.6 4.5 4.2"/>
        <path d="M20 12h5M20 16h5M20 20h3.5"/>
      </g>
      <text x="72" y="25" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="-0.4">dsh-model-persona</text>
      <text x="72" y="50" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="400">Model-aware dynamic persona injector for DSH</text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="148" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400">
      <tspan x="0" dy="0">Inject only the active model's persona per turn — zero cross-talk, zero token bloat.</tspan>
      <tspan x="0" dy="26" fill="#8e8e98">同 DSH 多模型各用各的人设 · 匹配度打分兼容中转站后缀 · 内置默认与本地私有覆盖</tspan>
    </text>

    <!-- Feature Chips -->
    <g transform="translate(0, 204)" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="12">
      <rect x="0" y="0" width="168" height="28" rx="8" fill="#1d1d20" stroke="#2f2f35"/>
      <text x="84" y="18" text-anchor="middle" fill="#e4e4e7">9 Built-in Personas</text>

      <rect x="180" y="0" width="166" height="28" rx="8" fill="#1d1d20" stroke="#2f2f35"/>
      <text x="263" y="18" text-anchor="middle" fill="#e4e4e7">Scored Relay Match</text>

      <rect x="358" y="0" width="174" height="28" rx="8" fill="#1d1d20" stroke="#2f2f35"/>
      <text x="445" y="18" text-anchor="middle" fill="#e4e4e7">Local Override Safe</text>
    </g>
  </g>

  <!-- Right Column: Live Routing Preview Card -->
  <g transform="translate(656, 40)">
    <rect x="0" y="0" width="492" height="260" rx="14" fill="url(#cardBg)" stroke="#303036"/>

    <!-- Window Header -->
    <circle cx="20" cy="20" r="4.5" fill="#3a3a42"/>
    <circle cx="36" cy="20" r="4.5" fill="#3a3a42"/>
    <circle cx="52" cy="20" r="4.5" fill="#3a3a42"/>
    <text x="72" y="24" fill="#8e8e98" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="11.5">systemPrompt.section('model-persona')</text>
    <rect x="394" y="9" width="84" height="22" rx="11" fill="#fafafa"/>
    <text x="436" y="23.5" text-anchor="middle" fill="#141416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Live Match</text>
    <line x1="1" y1="40" x2="491" y2="40" stroke="#2b2b31"/>

    <!-- Active Row 1 -->
    <g transform="translate(18, 56)" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="12.5">
      <rect x="0" y="0" width="456" height="36" rx="8" fill="#25252b" stroke="#3b3b44"/>
      <circle cx="16" cy="18" r="4" fill="#34d399"/>
      <text x="30" y="22" fill="#ffffff" font-weight="600">freepi/deepseek-v4.1-flash</text>
      <text x="278" y="22" fill="#71717a">→</text>
      <rect x="300" y="7" width="144" height="22" rx="6" fill="#17241f" stroke="#285846"/>
      <text x="372" y="22" text-anchor="middle" fill="#6ee7b7" font-size="11">deepseek.md (local)</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(18, 102)" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="12.5">
      <rect x="0" y="0" width="456" height="34" rx="8" fill="#19191d" stroke="#2b2b31"/>
      <circle cx="16" cy="17" r="3.5" fill="#60a5fa"/>
      <text x="30" y="21" fill="#e4e4e7">linkapi/[次]gpt-6.2sol</text>
      <text x="278" y="21" fill="#71717a">→</text>
      <rect x="300" y="6" width="144" height="22" rx="6" fill="#202026" stroke="#34343c"/>
      <text x="372" y="21" text-anchor="middle" fill="#d4d4d8" font-size="11">gpt.md (builtin)</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(18, 144)" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="12.5">
      <rect x="0" y="0" width="456" height="34" rx="8" fill="#19191d" stroke="#2b2b31"/>
      <circle cx="16" cy="17" r="3.5" fill="#a78bfa"/>
      <text x="30" y="21" fill="#e4e4e7">autoclaw/zaicoding_glm-5.3</text>
      <text x="278" y="21" fill="#71717a">→</text>
      <rect x="300" y="6" width="144" height="22" rx="6" fill="#202026" stroke="#34343c"/>
      <text x="372" y="21" text-anchor="middle" fill="#d4d4d8" font-size="11">glm.md (builtin)</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(18, 186)" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="12.5">
      <rect x="0" y="0" width="456" height="34" rx="8" fill="#19191d" stroke="#2b2b31"/>
      <circle cx="16" cy="17" r="3.5" fill="#f472b6"/>
      <text x="30" y="21" fill="#a1a1aa">gemini / claude / kimi / qwen ...</text>
      <text x="278" y="21" fill="#71717a">→</text>
      <rect x="300" y="6" width="144" height="22" rx="6" fill="#202026" stroke="#34343c"/>
      <text x="372" y="21" text-anchor="middle" fill="#a1a1aa" font-size="11">auto-matched</text>
    </g>

    <!-- Bottom bar -->
    <text x="20" y="242" fill="#7c7c86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5">Priority: ~/.dsh/personas/&lt;role&gt;.md (Private) &gt; Package Built-in Defaults (Public)</text>
  </g>
</svg>
