<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" fill="none">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="429" rx="18" fill="url(#canvas)" stroke="#2b2b30"/>

  <!-- Top Header -->
  <text x="40" y="42" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600">效果对比：装插件前 vs 装插件后</text>
  <text x="1160" y="42" text-anchor="end" fill="#8e8e98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">同一 DSH 客户端切换模型时自动切人设，既不串戏也不多耗 Token</text>

  <!-- Left Card: BEFORE -->
  <g transform="translate(40, 68)">
    <rect x="0" y="0" width="530" height="326" rx="14" fill="#1a1a1d" stroke="#2d2d33"/>
    <rect x="18" y="16" width="84" height="24" rx="12" fill="#2c1d1f" stroke="#5c2c31"/>
    <text x="60" y="32" text-anchor="middle" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600">装插件前</text>
    <text x="114" y="32.5" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500">所有模型被迫共用同一份 AGENTS.md</text>
    <line x1="1" y1="54" x2="529" y2="54" stroke="#29292f"/>

    <!-- Single AGENTS.md box -->
    <rect x="24" y="74" width="482" height="40" rx="8" fill="#212126" stroke="#35353d"/>
    <text x="40" y="99" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">~/.dsh/AGENTS.md</text>
    <text x="490" y="99" text-anchor="end" fill="#9a9aa4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">固定注入全部会话（全员可见）</text>

    <!-- Model Rows -->
    <g transform="translate(24, 130)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">
      <rect x="0" y="0" width="482" height="36" rx="8" fill="#17171a" stroke="#29292f"/>
      <text x="14" y="23" fill="#fafafa" font-family="ui-monospace, Consolas, monospace" font-size="12.5">deepseek-v4.1</text>
      <text x="200" y="23" fill="#7c7c86">→ 表现正常，按设定回复</text>

      <rect x="0" y="44" width="482" height="36" rx="8" fill="#1e1718" stroke="#48292d"/>
      <text x="14" y="67" fill="#fafafa" font-family="ui-monospace, Consolas, monospace" font-size="12.5">glm-5.3 / qwen3</text>
      <text x="200" y="67" fill="#fca5a5">→ 串台：全部自称同一人设</text>

      <rect x="0" y="88" width="482" height="36" rx="8" fill="#1e1718" stroke="#48292d"/>
      <text x="14" y="111" fill="#fafafa" font-family="ui-monospace, Consolas, monospace" font-size="12.5">若全写入一份文件</text>
      <text x="200" y="111" fill="#fca5a5">→ 每轮白烧 N 倍提示词 Token</text>
    </g>

    <rect x="18" y="274" width="494" height="34" rx="8" fill="#221c1d" stroke="#452b2e"/>
    <text x="34" y="295" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">痛点：换了模型却换不了灵魂；手写分支判断浪费 Token 且容易误判</text>
  </g>

  <!-- Center Arrow -->
  <g transform="translate(580, 214)">
    <circle cx="20" cy="18" r="18" fill="#232329" stroke="#383842"/>
    <path d="M13 18h14m0 0l-5-5m5 5l-5 5" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Card: AFTER -->
  <g transform="translate(630, 68)">
    <rect x="0" y="0" width="530" height="326" rx="14" fill="#1a1a1d" stroke="#34343c"/>
    <rect x="18" y="16" width="84" height="24" rx="12" fill="#182b24" stroke="#285846"/>
    <text x="60" y="32" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600">装插件后</text>
    <text x="114" y="32.5" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500">按模型名只注入当前那一份人设</text>
    <line x1="1" y1="54" x2="529" y2="54" stroke="#29292f"/>

    <!-- Routing rows -->
    <g transform="translate(24, 72)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">
      <rect x="0" y="0" width="482" height="40" rx="8" fill="#1d2421" stroke="#2b4f41"/>
      <text x="14" y="25" fill="#ffffff" font-family="ui-monospace, Consolas, monospace">freepi/deepseek-v4.1</text>
      <text x="214" y="25" fill="#6ee7b7">→ deepseek.md</text>
      <text x="468" y="25" text-anchor="end" fill="#a7f3d0" font-size="11.5">命中本地私有覆盖</text>

      <rect x="0" y="48" width="482" height="40" rx="8" fill="#17171b" stroke="#2d2d35"/>
      <text x="14" y="73" fill="#e4e4e7" font-family="ui-monospace, Consolas, monospace">linkapi/[次]gpt-6.2sol</text>
      <text x="214" y="73" fill="#93c5fd">→ gpt.md</text>
      <text x="468" y="73" text-anchor="end" fill="#8e8e98" font-size="11.5">匹配度兼容前后缀</text>

      <rect x="0" y="96" width="482" height="40" rx="8" fill="#17171b" stroke="#2d2d35"/>
      <text x="14" y="121" fill="#e4e4e7" font-family="ui-monospace, Consolas, monospace">glm / kimi / qwen / claude</text>
      <text x="214" y="121" fill="#d4d4d8">→ 对应内置 9 大模板</text>
      <text x="468" y="121" text-anchor="end" fill="#8e8e98" font-size="11.5">直装即用无需手写</text>

      <rect x="0" y="144" width="482" height="40" rx="8" fill="#161619" stroke="#27272e"/>
      <text x="14" y="169" fill="#9a9aa4" font-family="ui-monospace, Consolas, monospace">未匹配到任何规则的模型</text>
      <text x="214" y="169" fill="#9a9aa4">→ 返回空（整段丢弃）</text>
      <text x="468" y="169" text-anchor="end" fill="#71717a" font-size="11.5">零额外 Token 开销</text>
    </g>

    <rect x="18" y="274" width="494" height="34" rx="8" fill="#17241f" stroke="#254c3d"/>
    <text x="34" y="295" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">体验：中途切模型下一轮立即切换角色；私人设定留在 ~/.dsh/personas/ 不进仓库</text>
  </g>
</svg>
